# AI 厂商配置文件
# 每个厂商定义：文档 spec URL、测试 API endpoint、认证方式、要监控的接口
# 密钥通过环境变量引用，格式：${ENV_VAR_NAME}

vendors:
  openai:
    enabled: true
    display_name: "OpenAI"
    adapter_class: "openai"
    # 官方 OpenAPI spec（机器可读）
    doc_spec_url: "https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml"
    doc_spec_format: "openapi_yaml"
    # 私有测试 API 端点（bella-openapi 暴露的 OpenAI 兼容接口）
    test_api:
      base_url: "${BELLA_API_BASE_URL:-http://localhost:8080}"
      api_key: "${BELLA_TEST_API_KEY}"
      # 可选：使用专用测试 API Key（低配额，仅用于 probe）
      timeout: 30
    endpoints:
      - name: chat_completions
        path: /v1/chat/completions
        probe_model: "${OPENAI_PROBE_MODEL:-gpt-4o-mini}"
      - name: embeddings
        path: /v1/embeddings
        probe_model: "${OPENAI_EMBED_MODEL:-text-embedding-3-small}"

  anthropic:
    enabled: true
    display_name: "Anthropic"
    adapter_class: "anthropic"
    doc_spec_url: "https://raw.githubusercontent.com/anthropics/anthropic-sdk-python/main/api.md"
    doc_spec_format: "markdown_api_ref"
    test_api:
      base_url: "${BELLA_API_BASE_URL:-http://localhost:8080}"
      api_key: "${BELLA_TEST_API_KEY}"
      timeout: 30
    endpoints:
      - name: messages
        path: /v1/messages
        probe_model: "${ANTHROPIC_PROBE_MODEL:-claude-haiku-4-5-20251001}"

  aws_bedrock:
    enabled: false  # 需要 AWS SDK 凭证，默认关闭
    display_name: "AWS Bedrock"
    adapter_class: "aws_bedrock"
    # AWS SDK botocore service model（本地安装 boto3 后可读）
    doc_spec_url: "botocore://bedrock-runtime"
    doc_spec_format: "botocore_service_model"
    test_api:
      base_url: "${BELLA_API_BASE_URL:-http://localhost:8080}"
      api_key: "${BELLA_TEST_API_KEY}"
      timeout: 60
    endpoints:
      - name: chat_completions
        path: /v1/chat/completions
        probe_model: "${AWS_PROBE_MODEL:-claude-3-haiku-20240307}"

  google_vertex:
    enabled: false
    display_name: "Google Vertex AI / Gemini"
    adapter_class: "google_vertex"
    doc_spec_url: "https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta"
    doc_spec_format: "google_discovery"
    test_api:
      base_url: "${BELLA_API_BASE_URL:-http://localhost:8080}"
      api_key: "${BELLA_TEST_API_KEY}"
      timeout: 30
    endpoints:
      - name: chat_completions
        path: /v1/chat/completions
        probe_model: "${VERTEX_PROBE_MODEL:-gemini-2.0-flash}"

  aliyun:
    enabled: false
    display_name: "阿里云 / 通义千问"
    adapter_class: "aliyun"
    # 阿里云无标准 OpenAPI spec，仅做 Layer 2 响应 diff
    doc_spec_url: null
    doc_spec_format: "none"
    test_api:
      base_url: "${BELLA_API_BASE_URL:-http://localhost:8080}"
      api_key: "${BELLA_TEST_API_KEY}"
      timeout: 30
    endpoints:
      - name: chat_completions
        path: /v1/chat/completions
        probe_model: "${QWEN_PROBE_MODEL:-qwen-turbo}"

  huoshan:
    enabled: false
    display_name: "字节跳动火山引擎"
    adapter_class: "huoshan"
    doc_spec_url: null
    doc_spec_format: "none"
    test_api:
      base_url: "${BELLA_API_BASE_URL:-http://localhost:8080}"
      api_key: "${BELLA_TEST_API_KEY}"
      timeout: 30
    endpoints:
      - name: chat_completions
        path: /v1/chat/completions
        probe_model: "${HUOSHAN_PROBE_MODEL}"
