# reading 场景：测试长文理解能力
# 提供一段较长的文本，要求模型进行摘要或理解
# model 字段由运行时注入，不需要在这里填写

name: reading
description: "测试模型的长文理解与摘要能力，验证长上下文处理相关字段结构"

chat_completions:
  messages:
    - role: user
      content: |
        请对以下文章进行简短摘要（不超过 3 句话）：

        人工智能（AI）是计算机科学的一个分支，致力于创建能够执行通常需要人类智能的任务的系统。
        这些任务包括视觉感知、语音识别、决策制定和语言翻译。AI 研究的奠基者们认为人类智能的每个方面
        都可以被精确描述，以至于机器可以被制造来模拟它。这引发了关于 AI 的乐观情绪，也引发了人们
        对其潜在危险的担忧。现代 AI 技术包括机器学习、深度学习、自然语言处理等多个子领域。
        近年来，大型语言模型（LLM）的出现标志着 AI 发展的重要里程碑，这些模型能够生成连贯的文本、
        回答问题、编写代码等。
  max_tokens: 256

